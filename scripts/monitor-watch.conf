# Settings and watch list for monitor.sh — every address the monitor needs.
#
# Example values. The deployed copy owns the real network and is never
# overwritten by a sync (twin `Exclude`) — edit it where dylan runs. Keeping
# the addresses here rather than in monitor.sh is what lets the script itself
# be published.
#
# ── Network ──────────────────────────────────────────────────────────────
#   SUBNET         the /24 the sweep walks
#   REFERENCE_IP   a host known to be up; if it misses the sweep, ICMP in the
#                  container is broken and the report says so instead of
#                  claiming an empty list. Never the docker host's own address
#                  on the macvlan parent — a macvlan child cannot reach it.
#   MILAN_URL      base URL of the milan agent used as the LAN vantage point
#                  and as the board's widget inbox
SUBNET="192.168.1"
REFERENCE_IP="192.168.1.150"
MILAN_URL="http://192.168.1.10:8080"

# ── LiveSync watchdog ────────────────────────────────────────────────────
# Hosts whose headless LiveSync daemon is watched, as "name:base-url". Take a
# host out the moment it stops running LiveSync, or its tile stays on the
# board as a red corpse and the watchdog keeps asking for a restart of
# something that is not there. Empty is a legitimate state.
LIVESYNC_AGENTS=(
  "example:http://192.168.1.10:8080"
)

# ── Watch list ───────────────────────────────────────────────────────────
# Format: ["tile-id"]="Label:IP:expectation:vantage"
#   expectation  darf-aus  off is normal (VMs) — neutral grey
#                soll-an   off is worth a warning — yellow
#   vantage      direkt    ping from this container
#                mini      ask milan's /reach on the Mac mini (ping OR ARP);
#                          needed for devices this macvlan child cannot
#                          reach directly (hairpin)
declare -A WATCH=(
  ["vm-example"]="Example VM:192.168.1.10:darf-aus:mini"
  ["plug-example"]="Smart Plug:192.168.1.11:soll-an:direkt"
)
