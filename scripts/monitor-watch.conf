# Watch list for monitor.sh — the devices the monitor keeps an eye on.
#
# Example values. The deployed copy owns the real devices and is never
# overwritten by a sync (twin `Own:`) — edit it where dylan runs.
#
# Format: ["tile-id"]="Label:IP:expectation:vantage"
#   expectation  darf-aus  off is normal (VMs) — neutral grey
#                soll-an   off is worth a warning — yellow
#   vantage      direkt    ping from this container
#                mini      ask milan's /reach on the Mac mini (ping OR ARP);
#                          needed for devices this macvlan child cannot
#                          reach directly (hairpin)
declare -A WATCH=(
  ["vm-example"]="Example VM:192.168.1.10:darf-aus:mini"
  ["plug-example"]="Smart Plug:192.168.1.11:soll-an:direkt"
)
